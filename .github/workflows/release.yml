name: Release binaries

# Builds the lizard program for every supported system, checks each binary with
# tests/test_binary.sh, and attaches the archives and SHA256SUMS to the release.
#
#   release published   build the release's tag and attach the archives to it
#   workflow_dispatch   build a given tag; attach only if 'upload' is set
#   push of this file   dry run: build and test, keep the archives as artifacts
#
# The binaries are built from the tag, not from the default branch, so a release
# can be reproduced later.

on:
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (for example v2.2.0)'
        required: true
      upload:
        description: 'Attach the archives to that release'
        type: boolean
        default: false
  push:
    paths: [ '.github/workflows/release.yml' ]

permissions:
  contents: write

env:
  REF: ${{ github.event.release.tag_name || inputs.tag || github.sha }}

jobs:
  # ---------------------------------------------------------------------------
  # Linux and macOS.  The Linux binaries are static, so they run on any
  # distribution of that architecture; macOS links against the system libc and
  # declares the oldest version it supports.
  # ---------------------------------------------------------------------------
  unix:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            flags: 'LDFLAGS=-static'
            minver: ''
          - name: linux-i386
            os: ubuntu-latest
            flags: 'LDFLAGS=-static CC="gcc -m32"'
            packages: gcc-multilib
            minver: ''
          - name: linux-arm64
            os: ubuntu-24.04-arm
            flags: 'LDFLAGS=-static'
            minver: ''
          - name: macos-arm64
            os: macos-latest
            flags: 'CC="clang -mmacosx-version-min=11.0"'
            minver: '11.0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.REF }}
          # tests/test_binary.sh comes from this commit, so an older tag is
          # checked with the current tests too.
          path: src
      - uses: actions/checkout@v4
        with:
          path: current

      - name: Install packages
        if: matrix.packages
        run: sudo apt-get update && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y ${{ matrix.packages }}

      - name: Build the program and the test data generator
        run: |
          # The binary embeds __DATE__; SOURCE_DATE_EPOCH makes it, and the
          # archive built from it, reproducible from the tag.
          export SOURCE_DATE_EPOCH=$(git -C src log -1 --format=%ct)
          make -C src/programs lizard ${{ matrix.flags }}
          make -C src/tests datagen ${{ matrix.flags }}
          file src/programs/lizard

      - name: Check the binary
        run: bash current/tests/test_binary.sh src/programs/lizard src/tests/datagen

      - name: Package
        run: |
          ver=$(awk '/define LIZARD_VERSION_MAJOR/{a=$3}
                      /define LIZARD_VERSION_MINOR/{b=$3}
                      /define LIZARD_VERSION_RELEASE/{c=$3}
                      END{print a"."b"."c}' src/lib/lizard_compress.h)
          d=lizard-ex-$ver-${{ matrix.name }}
          mkdir "$d"
          cp src/programs/lizard src/programs/lizard.1 src/README.md src/NEWS "$d"/
          cp src/lib/LICENSE "$d/LICENSE-lib"
          cp src/programs/COPYING "$d/COPYING-programs"
          # Reproducible archive; make_archive.py instead of tar because macOS
          # ships bsdtar, which does not have the GNU options that do this.
          epoch=$(git -C src log -1 --format=%ct)
          python3 current/tests/make_archive.py "$d" "$d.tar.gz" "$epoch"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: lizard-ex-*.tar.gz

  # ---------------------------------------------------------------------------
  # Windows: cross-compiled on Linux with mingw-w64 (no Visual Studio anywhere
  # in the release) and then checked on a real Windows runner, which is also
  # where the archive is assembled.
  # ---------------------------------------------------------------------------
  windows-build:
    name: windows build (mingw)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.REF }}
          path: src

      - name: Install mingw-w64
        timeout-minutes: 15
        run: |
          sudo apt-get update
          sudo systemctl stop unattended-upgrades 2>/dev/null || true
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
              -o DPkg::Lock::Timeout=600 -o Acquire::Retries=3 \
              gcc-mingw-w64-x86-64 gcc-mingw-w64-i686

      - name: Build both architectures
        run: |
          export SOURCE_DATE_EPOCH=$(git -C src log -1 --format=%ct)
          make -C src windows
          mkdir -p dist/x64 dist/x86
          cp src/programs/lizard.exe src/tests/datagen.exe dist/x64/
          make -C src windows WINCC=i686-w64-mingw32-gcc
          cp src/programs/lizard.exe src/tests/datagen.exe dist/x86/
          ls -l dist/*/

      - uses: actions/upload-artifact@v4
        with:
          name: windows-binaries
          path: dist

  windows:
    name: windows-${{ matrix.arch }}
    needs: windows-build
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, x86]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.REF }}
          path: src
      - uses: actions/checkout@v4
        with:
          path: current

      - uses: actions/download-artifact@v4
        with:
          name: windows-binaries
          path: dist

      - name: Check the binary
        shell: bash
        run: |
          bash current/tests/test_binary.sh \
            "dist/${{ matrix.arch }}/lizard.exe" "dist/${{ matrix.arch }}/datagen.exe"

      - name: Package
        shell: bash
        run: |
          ver=$(awk '/define LIZARD_VERSION_MAJOR/{a=$3}
                      /define LIZARD_VERSION_MINOR/{b=$3}
                      /define LIZARD_VERSION_RELEASE/{c=$3}
                      END{print a"."b"."c}' src/lib/lizard_compress.h | tr -d '\r')
          d=lizard-ex-$ver-windows-${{ matrix.arch }}
          mkdir "$d"
          cp "dist/${{ matrix.arch }}/lizard.exe" src/README.md src/NEWS "$d"/
          cp src/lib/LICENSE "$d/LICENSE-lib.txt"
          cp src/programs/COPYING "$d/COPYING-programs.txt"
          # Reproducible archive: fixed timestamps in every entry.
          epoch=$(git -C src log -1 --format=%ct)
          touch -d "@$epoch" "$d"/*
          7z a -tzip "$d.zip" "$d" > /dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}
          path: lizard-ex-*.zip

  # ---------------------------------------------------------------------------
  # Checksums and upload.
  # ---------------------------------------------------------------------------
  attach:
    name: checksums and upload
    needs: [ unix, windows ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: SHA256SUMS
        run: cd dist && sha256sum lizard-ex-* > SHA256SUMS && cat SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: all-binaries
          path: dist/*

      - name: Attach to the release
        if: github.event_name == 'release' || inputs.upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # dist/ also holds the x64/ and x86/ folders of the windows-binaries
          # artifact; only the archives and the checksums are release assets.
          # SHA256SUMS has to be named explicitly: it does not match the
          # archive glob, and a stale one does not describe the archives.
          ls -l dist
          gh release upload "$REF" dist/lizard-ex-* dist/SHA256SUMS --clobber -R "$GITHUB_REPOSITORY"
