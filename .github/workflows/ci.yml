name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Linux x86_64: compiler warnings, sanitizers and the bounded test suite.
  # ---------------------------------------------------------------------------
  linux:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: gcc
            cc: gcc
            moreflags: ''
          - name: gcc -Werror
            cc: gcc
            moreflags: '-Werror'
          - name: clang -Werror
            cc: clang
            moreflags: '-Werror'
          - name: clang -Wconversion
            cc: clang
            moreflags: '-Werror -Wconversion -Wno-sign-conversion'
          - name: clang UBSan
            cc: clang
            moreflags: '-O1 -g -fsanitize=undefined -fno-sanitize-recover=all'
          - name: gcc ASan+UBSan
            cc: gcc
            moreflags: '-O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer'
    steps:
      - uses: actions/checkout@v4

      # MOREFLAGS is what the Makefiles append to their own warning set, so the
      # -Werror jobs check the same warnings as a normal build.  Passing CFLAGS
      # on the command line would replace them.
      - name: Build library and program
        run: make clean && make all CC=${{ matrix.cc }} MOREFLAGS="${{ matrix.moreflags }}"

      - name: Bounded test suite
        run: sh tests/test-fast.sh
        env:
          CC: ${{ matrix.cc }}
          MOREFLAGS: ${{ matrix.moreflags }}
          # The sanitizer builds run the reduced suite; everything else runs it
          # whole.
          LIZARD_QUICK: ${{ contains(matrix.moreflags, 'sanitize') && '1' || '0' }}

  # ---------------------------------------------------------------------------
  # Linux i386: the 32-bit build is a separate code path (size_t is 32 bits),
  # and it produces different streams than the 64-bit build on purpose.
  # ---------------------------------------------------------------------------
  linux-32bit:
    name: linux i386 (gcc -m32)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install gcc-multilib
        run: sudo apt-get update && sudo apt-get install -y gcc-multilib

      - name: Build
        run: make clean && make all CC="gcc -m32"

      - name: Bounded test suite
        run: sh tests/test-fast.sh
        env:
          CC: gcc -m32

  # ---------------------------------------------------------------------------
  # Linux arm64: a real arm64 runner, not emulation, so the timings and the
  # unaligned access behaviour are the ones users see.
  # ---------------------------------------------------------------------------
  linux-arm64:
    name: linux arm64
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: make clean && make all

      - name: Bounded test suite
        run: sh tests/test-fast.sh

  # ---------------------------------------------------------------------------
  # macOS arm64.
  # ---------------------------------------------------------------------------
  macos:
    name: macos arm64
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: make clean && make all CC=clang

      - name: Bounded test suite
        run: sh tests/test-fast.sh
        env:
          CC: clang

  # ---------------------------------------------------------------------------
  # Windows: cross-compiled on Linux with mingw-w64 (no Visual Studio), then
  # run on a real Windows runner.  Splitting it this way keeps the build in one
  # place and does not need wine in CI.
  # ---------------------------------------------------------------------------
  windows-build:
    name: windows build (mingw)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mingw-w64
        timeout-minutes: 10
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
              -o DPkg::Lock::Timeout=600 -o Acquire::Retries=3 \
              gcc-mingw-w64-x86-64 gcc-mingw-w64-i686

      - name: Build both architectures
        run: |
          make windows
          mkdir -p dist/x64 dist/x86
          cp programs/lizard.exe tests/datagen.exe dist/x64/
          make windows WINCC=i686-w64-mingw32-gcc
          cp programs/lizard.exe tests/datagen.exe dist/x86/
          ls -l dist/*/

      - uses: actions/upload-artifact@v4
        with:
          name: windows-binaries
          path: dist

  windows-check:
    name: windows check (${{ matrix.arch }})
    needs: windows-build
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, x86]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: windows-binaries
          path: dist

      - name: Check the binary
        shell: bash
        run: bash tests/test_binary.sh "dist/${{ matrix.arch }}/lizard.exe" "dist/${{ matrix.arch }}/datagen.exe"

  # ---------------------------------------------------------------------------
  # Interoperability: every stream must decode with every build, and builds
  # that share a pointer width must produce identical bytes.  This is the
  # cross-platform guarantee of the project.  The Windows binaries are checked
  # in the windows-check job, on real Windows, so this job covers the Linux
  # targets: 32 vs 64 bits and x86 vs arm64.
  # ---------------------------------------------------------------------------
  interop:
    name: interop (32/64-bit, x86/arm64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cross toolchains and runners
        timeout-minutes: 20
        run: |
          # gcc-multilib and gcc-aarch64-linux-gnu cannot be installed in the
          # same Ubuntu image (their libc-dev packages collide), so the 32-bit
          # build uses the i686 cross compiler here; build-matrix.sh picks it
          # automatically when gcc -m32 is not available.
          sudo dpkg --add-architecture i386
          sudo apt-get update
          # The runner's unattended-upgrades can hold the dpkg lock; wait for it
          # instead of failing (or hanging) and retry the downloads.
          sudo systemctl stop unattended-upgrades 2>/dev/null || true
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
              -o DPkg::Lock::Timeout=600 -o Acquire::Retries=3 \
                                  gcc-i686-linux-gnu libc6-dev-i386-cross \
                                  gcc-aarch64-linux-gnu libc6-dev-arm64-cross \
                                  qemu-user qemu-user-static

      - name: Build the matrix
        run: sh tests/build-matrix.sh build-matrix

      - name: Interoperability test
        run: sh tests/test_interop.sh build-matrix/*

  # ---------------------------------------------------------------------------
  # Decoder fuzzing: arbitrary and corrupted streams must fail cleanly.  The
  # harness is built with ASan and UBSan, so a read past a buffer or an
  # undefined operation is a finding.
  # ---------------------------------------------------------------------------
  fuzz:
    name: decoder fuzzing (libFuzzer, ASan+UBSan)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Fuzz
        run: sh tests/test-fuzz.sh 120

  # ---------------------------------------------------------------------------
  # valgrind: memory errors on the paths the tests exercise.
  # ---------------------------------------------------------------------------
  valgrind:
    name: valgrind
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install valgrind
        run: sudo apt-get update && sudo apt-get install -y valgrind

      - name: Memory checker run
        run: sh tests/test-valgrind.sh

  # ---------------------------------------------------------------------------
  # Poisoned heap: compression must not depend on uninitialised memory, so a
  # recycled heap may not change the output.
  # ---------------------------------------------------------------------------
  poisoned-heap:
    name: poisoned heap
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compression must be deterministic
        run: sh tests/test-poisoned-heap.sh
